version: '3.8'

services:
  projectpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: projectpulse:latest
    container_name: projectpulse_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DOCKER=1
      - PROJECT_PULSE_DB=/app/data/project_pulse.db
      - SMTP_PROVIDER=${SMTP_PROVIDER:-outlook}
      - SMTP_HOST=${SMTP_HOST:-smtp.office365.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SENDER_NAME=${SENDER_NAME:-ProjectPulse Notifications}
    volumes:
      # Persistent storage volume for SQLite database
      - projectpulse_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  projectpulse_data:
    name: projectpulse_data
